# Single source of truth for the whole pipeline.
# Override with another file via env var PDM_CONFIG (e.g. configs/params.ci.yaml).

seed: 42

data:
  source: azure                      # azure | sample
  raw_dir: data/raw
  processed_dir: data/processed
  base_urls:                         # tried in order
    # official Microsoft location (offline since 2026)
    - https://azuremlsampleexperiments.blob.core.windows.net/datasets
    # GitHub mirrors of the same Kaggle/Microsoft files (identical sizes in both)
    - https://raw.githubusercontent.com/ashishpatel26/Predictive_Maintenance_using_Machine-Learning_Microsoft_Casestudy/master/data
    - https://raw.githubusercontent.com/AadityaKumra/PredictiveMaintenance/main/Datasets
  files:
    telemetry: PdM_telemetry.csv
    errors: PdM_errors.csv
    maint: PdM_maint.csv
    failures: PdM_failures.csv
    machines: PdM_machines.csv

validation:
  max_null_fraction: 0.05            # more nulls than this in any sensor column -> fail
  report_dir: reports/validation
  alert_webhook_env: PDM_ALERT_WEBHOOK   # optional Discord/LINE/Slack webhook URL

cleaning:
  ffill_limit_hours: 3               # forward-fill gaps up to 3 h per machine
  # soft bounds: values outside are clipped (hard bounds live in schema.py)
  clip:
    volt: [97, 256]
    rotate: [138, 696]
    pressure: [51, 186]
    vibration: [14, 77]

features:
  sensors: [volt, rotate, pressure, vibration]
  windows_hours: [3, 24]
  error_types: [error1, error2, error3, error4, error5]
  components: [comp1, comp2, comp3, comp4]
  sample_every_hours: 3              # keep one row every 3 h to reduce autocorrelation
  max_days_since_maint: 365          # cap for "never maintained"

label:
  horizon_hours: 24

split:                               # time-based split (end is exclusive)
  train: ["2015-01-01", "2015-09-01"]
  val:   ["2015-09-01", "2015-11-01"]
  test:  ["2015-11-01", "2016-01-02"]

costs:                               # business assumptions (THB)
  false_negative: 50000              # unplanned breakdown
  false_positive: 5000               # unnecessary planned inspection

experiments:                         # run in this order; best val PR-AUC becomes candidate
  - name: rule_baseline
    model: rule
    params: {feature: vibration_mean_24h}
  - name: logreg
    model: logreg
    params: {C: 1.0}
  - name: random_forest
    model: random_forest
    params: {n_estimators: 200, max_depth: 12, min_samples_leaf: 5}
  - name: xgboost
    model: xgboost
    params: {n_estimators: 300, max_depth: 5, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8}

gate:                                # must pass ALL to be promoted
  min_recall: 0.80
  min_precision: 0.50
  max_p95_latency_ms: 100
  max_model_size_mb: 50
  must_beat_champion: true           # test PR-AUC >= champion PR-AUC
  threshold_margin: 0.05             # pick the threshold on val with this safety margin above the gate

registry:
  model_name: pdm-failure-24h
  experiment_name: pdm-failure-24h

serving:
  history_hours: 24
  slo:                               # published service level objectives
    p95_latency_ms: 100              # end-to-end /predict latency
    error_rate: 0.01                 # share of 5xx responses
    availability: 0.99

retrain:
  recent_weight: 5                   # after drift, each recent row counts 5x an old row

monitoring:
  reference_sample_rows: 20000
  psi_threshold: 0.2
  ks_pvalue: 0.01
  drift_share_threshold: 0.3         # >= 30% of features drifted -> data drift alert
  min_recall: 0.70                   # live recall below this -> concept drift alert
  report_dir: reports/monitoring
