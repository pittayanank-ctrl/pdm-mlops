name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONPATH: src
  PDM_CONFIG: configs/params.ci.yaml   # small synthetic dataset, same schema as the real one

jobs:
  # 1) code quality: lint, formatting, unit tests
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Unit tests
        run: pytest

  # 2) data correctness: clean data must pass, every kind of broken data must be rejected
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -c requirements.lock
      - name: Generate data
        run: python -m pdm.data.ingest
      - name: Clean data passes the schema
        run: python -m pdm.validation.validate
      - name: Broken data is rejected
        run: |
          python -m pdm.validation.bad_data
          for case in data/bad/*; do
            if python -m pdm.validation.validate --raw-dir "$case"; then
              echo "::error::$case was NOT rejected"; exit 1
            fi
            echo "OK: $case rejected"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: validation-reports, path: reports/validation}

  # 3) model quality: run the whole pipeline; fail if the candidate does not pass the gate
  model-quality:
    runs-on: ubuntu-latest
    needs: [code-quality, data-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -c requirements.lock
      - name: Train + evaluate + gate
        env: {GIT_COMMIT: "${{ github.sha }}"}
        run: python -m pdm.pipelines.training_flow --fail-on-reject
      - name: Gate summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("reports/gate/latest.json")
          if p.exists():
              r = json.loads(p.read_text())
              print(f"## Model gate: {'PASSED' if r['passed'] else 'REJECTED'}\n")
              print("| check | value | rule | result |\n|---|---|---|---|")
              for c in r["checks"]:
                  print(f"| {c['name']} | {c['value']:.4f} | {c['rule']} | {'pass' if c['passed'] else 'FAIL'} |")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: model-reports, path: reports/}

  # 4) the image builds (CD: this is what docker compose runs)
  docker-build:
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pdm-mlops:${{ github.sha }} .
