name: pdm

x-env: &env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  PREFECT_API_URL: http://prefect:4200/api
  API_URL: http://api:8000
  PDM_CONFIG: ${PDM_CONFIG:-configs/params.yaml}
  PDM_ALERT_WEBHOOK: ${PDM_ALERT_WEBHOOK:-}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}

x-app: &app
  build: .
  image: pdm-mlops:latest
  volumes:
    - ./data:/app/data
    - ./reports:/app/reports
    # named volume, not a host folder: appending to a Windows/macOS bind mount costs ~11 ms per write,
    # which alone broke the latency SLO. Read logs with: docker compose run --rm pipeline ls logs
    - api-logs:/app/logs

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  prefect:
    image: prefecthq/prefect:3.1.15-python3.12
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
    ports: ["4200:4200"]
    volumes: [prefect-data:/root/.prefect]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *app
    command: sh scripts/start_api.sh
    environment:
      <<: *env
      API_WORKERS: ${API_WORKERS:-4}
      # one request = tiny matrices: per-process thread pools only fight each other across workers
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MODEL_POLL_SECONDS: "15"
    ports: ["8000:8000"]
    depends_on:
      mlflow: {condition: service_healthy}
    restart: unless-stopped

  # one-off jobs: docker compose run --rm pipeline <command>
  pipeline:
    <<: *app
    command: python -m pdm.pipelines.training_flow
    environment: *env
    profiles: ["jobs"]
    depends_on:
      mlflow: {condition: service_healthy}
      prefect: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  mlflow-data:
  prefect-data:
  api-logs:
